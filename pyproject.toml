[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-decision-lab"
version = "0.1.0"
description = "Evidence-preserving transcript signals, Jeff decisions and paper replay"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
youtube = ["youtube-transcript-api>=1.2.5,<2"]
asr = ["faster-whisper>=1.2,<2"]
dev = ["ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
signal-lab = "signal_lab.cli:main"

[tool.setuptools.packages.find]
include = ["signal_lab*"]

[tool.setuptools.data-files]
"share/signal-decision-lab/examples" = ["examples/synthetic-transcript.json", "examples/synthetic-bars.csv"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

